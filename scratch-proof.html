<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="./game.css">
<style>
body { background: #0c1825; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
.test-dock { display: flex; align-items: center; gap: 12px; width: 620px; background: #0f273d; padding: 18px; border-radius: 18px; border: 1px solid rgba(161,214,242,0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
input { flex: 1; height: 48px; background: rgba(8,23,38,0.95); border: 1px solid rgba(161,214,242,0.4); border-radius: 12px; color: #fff; padding: 0 16px; font-size: 17px; font-weight: 500; }
.voice-button { height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 800; font-size: 15px; border: 1px solid #9e202b !important; background: #c9343f !important; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important; box-shadow: 0 0 0 4px rgba(216,75,85,0.4); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.mark-btn { height: 48px; padding: 0 20px; border-radius: 12px; font-weight: 800; background: #ffffff; color: #0f273d; border: none; font-size: 15px; }
.hint { margin-top: 14px; color: #a1d6f2; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="test-dock">
  <input type="text" value="Germany" readonly>
  <button type="button" class="voice-button listening">● Listening</button>
  <button class="mark-btn">Mark Country →</button>
</div>
<p class="hint">Microphone on · say one country name.</p>
</body>
</html>
